<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="position:relative;width:{{ s }}px;height:{{ s }}px;perspective:{{ persp }}px;pointer-events:none;">
  <div ref="{{ rotor }}" style="position:absolute;inset:0;transform-style:preserve-3d;transform:rotateX(-20deg) rotateY(35deg);will-change:transform;">
    <sc-for list="{{ orbs }}" as="o" hint-placeholder-count="0">
      <div style="position:absolute;left:50%;top:50%;width:{{ o.d }}px;height:{{ o.d }}px;margin:{{ o.m }}px 0 0 {{ o.m }}px;border-radius:50%;background:radial-gradient(circle,#FFFFFF 0%,rgba(255,255,255,0.5) 30%,rgba(255,255,255,0) 70%);transform:{{ o.t }};opacity:{{ o.op }};transition:opacity 0.8s ease;"></div>
    </sc-for>
    <sc-for list="{{ lines }}" as="l" hint-placeholder-count="0">
      <div style="position:absolute;left:50%;top:50%;width:{{ l.len }}px;height:1px;margin-left:{{ l.m }}px;background:linear-gradient(90deg,rgba(255,255,255,0),#FFFFFF 50%,rgba(255,255,255,0));transform:{{ l.t }};opacity:{{ l.op }};transition:opacity 0.8s ease;"></div>
    </sc-for>
    <sc-for list="{{ faces }}" as="f" hint-placeholder-count="0">
      <div style="position:absolute;inset:0;transform:{{ f.t }};opacity:{{ f.op }};background:linear-gradient(135deg,rgba(255,255,255,0.20) 0%,rgba(255,255,255,0.04) 45%,rgba(255,255,255,0.02) 60%,rgba(255,255,255,0.12) 100%);border:1px solid rgba(255,255,255,0.6);box-shadow:{{ f.shadow }};transition:transform 0.9s cubic-bezier(.2,.8,.2,1), opacity 0.9s ease, box-shadow 0.8s ease;display:flex;align-items:center;justify-content:center;backface-visibility:visible;">
        <sc-if value="{{ f.logo }}" hint-placeholder-val="{{ false }}">
          <img src="assets/c3-symbol.png" alt="" style="width:56%;opacity:{{ logoOp }};filter:drop-shadow(0 0 12px rgba(255,255,255,0.7));transition:opacity 0.9s ease;">
        </sc-if>
        <sc-if value="{{ f.glyph }}" hint-placeholder-val="{{ false }}">
          <span style="font-family:Orbitron,sans-serif;font-weight:600;color:#FFFFFF;font-size:{{ glyphSize }}px;letter-spacing:0.02em;text-shadow:0 0 10px rgba(255,255,255,0.6);">{{ glyph }}</span>
        </sc-if>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:320,&quot;height&quot;:320},&quot;size&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:200,&quot;tsType&quot;:&quot;number&quot;},&quot;progress&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:0,&quot;max&quot;:6,&quot;step&quot;:1,&quot;default&quot;:6,&quot;tsType&quot;:&quot;number&quot;},&quot;logo&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;glow&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;glyph&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;spin&quot;:{&quot;editor&quot;:&quot;float&quot;,&quot;default&quot;:8,&quot;tsType&quot;:&quot;number&quot;},&quot;rx&quot;:{&quot;editor&quot;:&quot;float&quot;,&quot;default&quot;:-20,&quot;tsType&quot;:&quot;number&quot;},&quot;ry&quot;:{&quot;editor&quot;:&quot;float&quot;,&quot;default&quot;:35,&quot;tsType&quot;:&quot;number&quot;},&quot;parallax&quot;:{&quot;editor&quot;:&quot;float&quot;,&quot;default&quot;:0,&quot;tsType&quot;:&quot;number&quot;},&quot;scrollFactor&quot;:{&quot;editor&quot;:&quot;float&quot;,&quot;default&quot;:0,&quot;tsType&quot;:&quot;number&quot;},&quot;assemble&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;delay&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:0,&quot;tsType&quot;:&quot;number&quot;}}">
class Component extends DCLogic {
  state = { ready: !this.props.assemble };
  rotor = React.createRef();
  componentDidMount() {
    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (this.props.assemble) this.t0 = setTimeout(() => this.setState({ ready: true }), Number(this.props.delay || 0) + 80);
    this.mx = 0; this.my = 0; this.visible = true;
    this.onMove = e => { this.mx = e.clientX / window.innerWidth - 0.5; this.my = e.clientY / window.innerHeight - 0.5; };
    window.addEventListener('pointermove', this.onMove, { passive: true });
    if ('IntersectionObserver' in window && this.rotor.current) {
      this.io = new IntersectionObserver(es => { this.visible = es[0].isIntersecting; });
      this.io.observe(this.rotor.current);
    }
    const start = performance.now();
    const loop = now => {
      this.raf = requestAnimationFrame(loop);
      if (!this.visible || !this.rotor.current) return;
      const p = this.props, t = (now - start) / 1000;
      const spin = reduce ? 0 : Number(p.spin ?? 0), par = reduce ? 0 : Number(p.parallax ?? 0), sf = reduce ? 0 : Number(p.scrollFactor ?? 0);
      const rx = Number(p.rx ?? -20) - this.my * par + Math.sin(window.scrollY * sf * 0.02) * 6;
      const ry = Number(p.ry ?? 35) + spin * t + this.mx * par + window.scrollY * sf;
      if (this.cx === undefined) { this.cx = rx; this.cy = ry; }
      this.cx += (rx - this.cx) * 0.08; this.cy += (ry - this.cy) * 0.08;
      this.rotor.current.style.transform = `rotateX(${this.cx.toFixed(2)}deg) rotateY(${this.cy.toFixed(2)}deg)`;
    };
    this.raf = requestAnimationFrame(loop);
  }
  componentWillUnmount() {
    cancelAnimationFrame(this.raf); clearTimeout(this.t0);
    window.removeEventListener('pointermove', this.onMove);
    this.io && this.io.disconnect();
  }
  renderVals() {
    const s = Number(this.props.size ?? 200), h = s / 2;
    const progress = this.state.ready ? Number(this.props.progress ?? 6) : 0;
    const glow = this.props.glow ?? false;
    const lit = progress >= 6;
    const glyph = this.props.glyph || '';
    const logo = this.props.logo ?? false;
    const base = [
      ['rotateY(180deg)', 2], ['rotateY(-90deg)', 2], ['rotateX(-90deg)', 2],
      ['rotateY(90deg)', 4], ['rotateX(90deg)', 4], ['rotateY(0deg)', 5]
    ];
    const faces = base.map(([r, need], i) => {
      const on = progress >= need;
      const front = i === 5;
      return {
        t: `${r} translateZ(${on ? h : h + s * 0.9}px)`,
        op: on ? 1 : 0,
        logo: front && logo,
        glyph: front && !!glyph,
        shadow: `inset 0 0 ${Math.round(s * 0.16)}px rgba(255,255,255,${lit && glow ? 0.35 : 0.14})${lit && glow ? `, 0 0 ${Math.round(s * 0.25)}px rgba(255,255,255,0.28)` : ''}`
      };
    });
    const coreOn = progress >= 1;
    const d = Math.round(s * (lit ? 0.5 : 0.38));
    const orbs = ['rotateY(0deg)', 'rotateY(90deg)', 'rotateX(90deg)'].map(t => ({ d, m: -d / 2, t, op: coreOn ? (lit ? 0.9 : 0.75) : 0 }));
    const len = Math.round(s * 1.3);
    const lines = ['rotateZ(45deg)', 'rotateZ(-45deg)', 'rotateY(90deg) rotateZ(45deg)', 'rotateY(90deg) rotateZ(-45deg)']
      .map(t => ({ len, m: -len / 2, t, op: progress >= 3 ? 0.7 : 0 }));
    return {
      s, persp: Math.round(s * 5), rotor: this.rotor, faces, orbs, lines, glyph,
      glyphSize: Math.round(s * 0.22), logoOp: logo && lit ? 1 : 0
    };
  }
}
</script>
</body>
</html>
