<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="position:relative;width:{{ s }}px;height:{{ s }}px;perspective:{{ persp }}px;pointer-events:none;">
  <div style="position:absolute;inset:0;transform-style:preserve-3d;transform:{{ rot }};">
    <div style="position:absolute;left:50%;top:50%;width:{{ coreS }}px;height:{{ coreS }}px;margin:{{ coreM }}px 0 0 {{ coreM }}px;transform-style:preserve-3d;opacity:{{ coreOp }};transform:scale({{ coreScale }});transition:{{ tr }};">
      <sc-for list="{{ coreFaces }}" as="c" hint-placeholder-count="0">
        <div style="position:absolute;inset:0;transform:{{ c }};border:1px solid rgba(255,255,255,0.55);background:rgba(255,255,255,0.07);box-shadow:inset 0 0 {{ coreGlow }}px rgba(255,255,255,0.35);"></div>
      </sc-for>
    </div>
    <sc-for list="{{ lines }}" as="l" hint-placeholder-count="0">
      <div style="position:absolute;left:50%;top:50%;width:{{ l.len }}px;height:1px;margin-left:{{ l.m }}px;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,0.85) 50%,rgba(255,255,255,0));transform:{{ l.t }};opacity:{{ l.op }};transition:{{ tr }};"></div>
    </sc-for>
    <sc-for list="{{ faces }}" as="f" hint-placeholder-count="0">
      <div style="position:absolute;inset:0;transform:{{ f.t }};opacity:{{ f.op }};background:{{ f.bg }};border:1px solid {{ f.bd }};box-shadow:{{ f.shadow }};transition:{{ tr }};display:flex;align-items:center;justify-content:center;backface-visibility:visible;">
        <sc-if value="{{ f.spec }}" hint-placeholder-val="{{ false }}">
          <span style="position:absolute;left:9%;top:7%;width:22%;height:2px;border-radius:2px;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,0.95),rgba(255,255,255,0));opacity:{{ specOp }};transition:{{ tr }};"></span>
        </sc-if>
        <sc-if value="{{ f.logo }}" hint-placeholder-val="{{ false }}">
          <img src="assets/c3-symbol.png" alt="" style="width:52%;opacity:{{ logoOp }};transform:scale({{ logoScale }});filter:drop-shadow(0 0 6px rgba(255,255,255,0.45));transition:{{ tr }};">
        </sc-if>
        <sc-if value="{{ f.glyph }}" hint-placeholder-val="{{ false }}">
          <span style="font-family:Orbitron,sans-serif;font-weight:600;color:#FFFFFF;font-size:{{ glyphSize }}px;letter-spacing:0.02em;opacity:0.92;">{{ glyph }}</span>
        </sc-if>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:320,&quot;height&quot;:320},&quot;size&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:200,&quot;tsType&quot;:&quot;number&quot;},&quot;progress&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:0,&quot;max&quot;:6,&quot;step&quot;:1,&quot;default&quot;:6,&quot;tsType&quot;:&quot;number&quot;},&quot;logo&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;glow&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;light&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:0,&quot;max&quot;:1,&quot;step&quot;:0.05,&quot;default&quot;:1,&quot;tsType&quot;:&quot;number&quot;},&quot;glyph&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;rx&quot;:{&quot;editor&quot;:&quot;float&quot;,&quot;default&quot;:-18,&quot;tsType&quot;:&quot;number&quot;},&quot;ry&quot;:{&quot;editor&quot;:&quot;float&quot;,&quot;default&quot;:30,&quot;tsType&quot;:&quot;number&quot;},&quot;assemble&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;delay&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:0,&quot;tsType&quot;:&quot;number&quot;}}">
class Component extends DCLogic {
  state = { ready: !this.props.assemble };
  componentDidMount() {
    this.reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (this.props.assemble && !this.reduce) this.t0 = setTimeout(() => this.setState({ ready: true }), Number(this.props.delay || 0) + 80);
    else if (!this.state.ready) this.setState({ ready: true });
  }
  componentWillUnmount() { clearTimeout(this.t0); }
  renderVals() {
    const s = Number(this.props.size ?? 200), h = s / 2;
    const progress = this.state.ready ? Number(this.props.progress ?? 6) : 0;
    const glow = !!(this.props.glow ?? false);
    const light = Math.max(0, Math.min(1, Number(this.props.light ?? (glow ? 1 : 0.4))));
    const lit = progress >= 6;
    const glyph = this.props.glyph || '';
    const logo = this.props.logo ?? false;
    const rx = Number(this.props.rx ?? -18), ry = Number(this.props.ry ?? 30);
    // [transform, stage at which the face is closed]
    const base = [['rotateY(180deg)', 2], ['rotateY(-90deg)', 2], ['rotateX(-90deg)', 2], ['rotateY(90deg)', 4], ['rotateX(90deg)', 4], ['rotateY(0deg)', 5]];
    const L = lit ? light : light * 0.6;
    const faces = base.map(([r, need], i) => {
      const on = progress >= need, frame = !on && progress >= 1, front = i === 5;
      return {
        t: `${r} translateZ(${on ? h : h + s * 0.16}px)`,
        op: on ? 1 : frame ? 1 : 0,
        bg: on ? `linear-gradient(140deg,rgba(255,255,255,${0.10 + 0.06 * L}) 0%,rgba(255,255,255,0.025) 48%,rgba(255,255,255,${0.04 + 0.05 * L}) 100%)` : 'transparent',
        bd: on ? `rgba(255,255,255,${0.62 + 0.3 * L})` : 'rgba(255,255,255,0.2)',
        shadow: on ? `inset 0 0 ${Math.round(s * 0.09)}px rgba(255,255,255,${0.08 + 0.14 * L})${lit && glow ? `, 0 0 ${Math.round(s * 0.14)}px rgba(255,255,255,${0.10 + 0.08 * L})` : ''}` : 'none',
        spec: front && on, logo: front && logo, glyph: front && !!glyph
      };
    });
    const coreS = Math.round(s * 0.3);
    const coreFaces = ['rotateY(0deg)', 'rotateY(90deg)', 'rotateY(180deg)', 'rotateY(-90deg)', 'rotateX(90deg)', 'rotateX(-90deg)'].map(r => `${r} translateZ(${coreS / 2}px)`);
    const len = Math.round(s * 0.62);
    const lines = ['rotateZ(45deg)', 'rotateZ(-45deg)', 'rotateY(90deg) rotateZ(45deg)', 'rotateY(90deg) rotateZ(-45deg)']
      .map(t => ({ len, m: -len / 2, t, op: progress >= 3 ? (lit ? 0.22 : 0.55) : 0 }));
    return {
      s, persp: Math.round(s * 5), rot: `rotateX(${rx}deg) rotateY(${ry}deg)`, faces, lines, glyph,
      coreS, coreM: -coreS / 2, coreFaces, coreOp: progress >= 1 ? (lit ? 0 : 0.9) : 0, coreScale: progress >= 1 ? 1 : 0.6,
      coreGlow: Math.round(coreS * 0.3),
      tr: this.reduce ? 'none' : 'transform .8s cubic-bezier(.2,.8,.2,1), opacity .7s ease, box-shadow .7s ease, border-color .7s ease, background .7s ease',
      glyphSize: Math.round(s * 0.22), logoOp: logo && lit ? 0.94 : 0, logoScale: logo && lit ? 1 : 0.9,
      specOp: 0.5 + 0.5 * L
    };
  }
}
</script>
</body>
</html>
