<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CORE 3 — Tecnologia que impulsiona seu negócio</title>
<meta name="description" content="Sites, automações, inteligência artificial e um sistema completo para organizar, atender, vender e crescer.">
<link rel="icon" href="assets/c3-symbol.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Orbitron:wght@500;600;700;800;900&amp;display=swap" rel="stylesheet">
<style>
html{scroll-behavior:smooth}
body{margin:0;background:#000000;color:#FFFFFF;font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
*{box-sizing:border-box}
a{color:inherit;text-decoration:none}
a:hover{color:inherit;opacity:.8}
button{font-family:inherit}
:focus-visible{outline:2px solid #6B6B6B;outline-offset:3px}
input::placeholder{color:#6B6B6B}
@keyframes c3in{0%{opacity:0;transform:translateY(8px)}14%,82%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-4px)}}
@keyframes c3cyc{0%,2%{opacity:0}6%,30%{opacity:1}34%,100%{opacity:0}}
@keyframes c3blink{0%,100%{opacity:1}50%{opacity:.2}}
@keyframes c3pop{0%{opacity:0;transform:scale(.9)}16%,84%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.94)}}
@keyframes c3dash{from{background-position-x:0}to{background-position-x:8px}}
@keyframes c3bar{0%{transform:scaleY(.18)}48%,100%{transform:scaleY(1)}}
@keyframes c3rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes c3inOnce{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes c3popOnce{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
@keyframes c3barOnce{from{transform:scaleY(.18)}to{transform:scaleY(1)}}
@keyframes c3wob{0%,100%{transform:scaleY(1)}28%{transform:scaleY(.66)}64%{transform:scaleY(1.14)}}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}*{transition-duration:0.01ms !important}*{animation:none !important}}
</style>
<style>#app{overflow-x:clip}</style>
</head>
<body>
<div id="app"></div>
<noscript>Ative o JavaScript para ver o site da CORE 3.</noscript>
<script src="dc-lite.js"></script>
<script src="app.js"></script>
</body>
</html>
